name: Release Markd

on:
  push:
    branches:
      - main

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Auto-incrementa versão patch (ex: 0.1.6 → 0.1.7)
      - name: Bump patch version
        id: bump
        shell: powershell
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $current = $config.version
          $parts = $current.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2] + 1
          $newVersion = "$major.$minor.$patch"

          Write-Host "Bumping version: $current → $newVersion"

          $raw = Get-Content src-tauri/tauri.conf.json -Raw
          $raw = $raw -replace '"version": "' + $current + '"', '"version": "' + $newVersion + '"'
          Set-Content src-tauri/tauri.conf.json $raw -NoNewline

          $pkg = Get-Content package.json -Raw
          $pkg = $pkg -replace '"version": "' + $current + '"', '"version": "' + $newVersion + '"'
          Set-Content package.json $pkg -NoNewline

          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace 'version = "' + $current + '"', 'version = "' + $newVersion + '"'
          Set-Content src-tauri/Cargo.toml $cargo -NoNewline

          echo "VERSION=$newVersion" >> $env:GITHUB_OUTPUT
          echo "TAG=v$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commit version bump
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.VERSION }} [skip ci]"
          git push

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Signing Key File
        id: key_setup
        shell: powershell
        run: |
          $keyContent = "untrusted comment: rsign encrypted secret key`nRWRTY0IyFfgMUpeiYexiguyOtqcC9yxkBZFC0V1EsKGqvpLF1N8AABAAAAAAAAAAAAIAAAAAaHsPP9dDAuNWjvx/T0oYpbHXEOmIPABwzzhRkDZRPtSTf1HpwndTix1CpHhTc6bOU9jnVbtrVnZU7bWUyqM5kFodykjvGQMsrPzbhA0Ee/dGtE5f6MXcpwS8xxb2PSSWv9JhIVOXB+w="
          Set-Content -Path "signing.key" -Value $keyContent -NoNewline
          echo "KEY_PATH=$((Get-Item signing.key).FullName)" >> $env:GITHUB_OUTPUT

      - name: Build and publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ steps.key_setup.outputs.KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "markdkey2026"
        with:
          tagName: ${{ steps.bump.outputs.TAG }}
          releaseName: 'Markd ${{ steps.bump.outputs.TAG }}'
          releaseBody: |
            ## Markd ${{ steps.bump.outputs.TAG }}

            Atualização lançada automaticamente pelo GitHub Actions.
          releaseDraft: false
          prerelease: false
          packageManager: npm
          tauriScript: npx tauri
          args: '--target x86_64-pc-windows-msvc'
