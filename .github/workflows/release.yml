name: Release Markd (Private Repo via GitHub Pages)

on:
  push:
    branches:
      - main

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Auto-incrementa versão patch (ex: 0.1.6 → 0.1.7)
      - name: Bump patch version
        id: bump
        shell: powershell
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $current = $config.version
          $parts = $current.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2] + 1
          $newVersion = "$major.$minor.$patch"

          Write-Host "Bumping version: $current → $newVersion"

          $raw = Get-Content src-tauri/tauri.conf.json -Raw
          $raw = $raw -replace '"version": "' + $current + '"', '"version": "' + $newVersion + '"'
          Set-Content src-tauri/tauri.conf.json $raw -NoNewline

          $pkg = Get-Content package.json -Raw
          $pkg = $pkg -replace '"version": "' + $current + '"', '"version": "' + $newVersion + '"'
          Set-Content package.json $pkg -NoNewline

          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace 'version = "' + $current + '"', 'version = "' + $newVersion + '"'
          Set-Content src-tauri/Cargo.toml $cargo -NoNewline

          echo "VERSION=$newVersion" >> $env:GITHUB_OUTPUT
          echo "TAG=v$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commit version bump
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.VERSION }} [skip ci]"
          git push

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.bump.outputs.TAG }}
          releaseName: 'Markd ${{ steps.bump.outputs.TAG }}'
          releaseBody: 'Atualização do Markd ${{ steps.bump.outputs.TAG }}'
          releaseDraft: false
          prerelease: false
          args: '--target x86_64-pc-windows-msvc'

      # Prepara arquivos do auto-updater para GitHub Pages (privado)
      - name: Prepare GitHub Pages Deployment
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path public-updater
          
          # Copia os arquivos de bundle e assinaturas gerados pelo Tauri
          $bundlePath = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          Get-ChildItem -Path $bundlePath -Recurse -Include *.zip, *.sig, *.json | Copy-Item -Destination public-updater -Force

          # Se existir latest.json, ajusta URLs para apontar para o GitHub Pages
          if (Test-Path "public-updater/latest.json") {
            $json = Get-Content public-updater/latest.json -Raw | ConvertFrom-Json
            # Atualiza url do pacote para o dominio gh-pages
            $baseUrl = "https://diegodesenaesilva-bit.github.io/markd"
            $json.platforms | Get-Member -MemberType NoteProperty | ForEach-Object {
              $prop = $_.Name
              $origUrl = $json.platforms.$prop.url
              $fileName = [System.IO.Path]::GetFileName($origUrl)
              $json.platforms.$prop.url = "$baseUrl/$fileName"
            }
            $json | ConvertTo-Json -Depth 10 | Set-Content public-updater/latest.json
          }

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-updater
          publish_branch: gh-pages
          force_orphan: true
