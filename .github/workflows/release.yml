name: Release Markd

# Dispara automaticamente em todo push para main
on:
  push:
    branches:
      - main

jobs:
  release:
    # Evita rodar em commits de bump de versão feitos pelo próprio workflow
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lê a versão atual, incrementa o patch (ex: 0.1.6 → 0.1.7) e
      # atualiza tauri.conf.json, package.json e Cargo.toml
      - name: Bump patch version
        id: bump
        shell: powershell
        run: |
          # Lê versão atual do tauri.conf.json
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $current = $config.version
          $parts = $current.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2] + 1
          $newVersion = "$major.$minor.$patch"

          Write-Host "Bumping version: $current → $newVersion"

          # Atualiza tauri.conf.json
          $raw = Get-Content src-tauri/tauri.conf.json -Raw
          $raw = $raw -replace '"version": "' + $current + '"', '"version": "' + $newVersion + '"'
          Set-Content src-tauri/tauri.conf.json $raw -NoNewline

          # Atualiza package.json
          $pkg = Get-Content package.json -Raw
          $pkg = $pkg -replace '"version": "' + $current + '"', '"version": "' + $newVersion + '"'
          Set-Content package.json $pkg -NoNewline

          # Atualiza Cargo.toml
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace 'version = "' + $current + '"', 'version = "' + $newVersion + '"'
          Set-Content src-tauri/Cargo.toml $cargo -NoNewline

          echo "VERSION=$newVersion" >> $env:GITHUB_OUTPUT
          echo "TAG=v$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commit version bump
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.VERSION }} [skip ci]"
          git push

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.bump.outputs.TAG }}
          releaseName: 'Markd ${{ steps.bump.outputs.TAG }}'
          releaseBody: |
            ## Markd ${{ steps.bump.outputs.TAG }}

            Atualização publicada automaticamente.
          releaseDraft: false
          prerelease: false
          args: '--target x86_64-pc-windows-msvc'
